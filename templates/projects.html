{% extends "base.html" %}

{% block content %}
<section id="projects">
    <div class="container">
        <h2>Projects</h2>
        <div class="projects-container">
            {% for project in projects %}
            <div class="project">
                <h3>{{ project.title }}</h3>
                <p>{{ project.description }}</p>
                <a href="{{ project.link }}" class="btn" target="_blank">View Project</a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
